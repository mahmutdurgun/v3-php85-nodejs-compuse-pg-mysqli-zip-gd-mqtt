ServerName localhost
Listen 127.0.0.1:8081
<VirtualHost 127.0.0.1:8081>
    DocumentRoot /opt/container-health
    <Directory /opt/container-health>
        Options -Indexes
        AllowOverride None
        Require local
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /dev/null combined
</VirtualHost>
